<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arch Linux — News & Wiki</title>
<style>
  :root {
    --blue:       #1793d1;
    --blue-dim:   #0f5f8a;
    --blue-faint: rgba(23,147,209,0.15);
    --bg-panel:   #0d1520;
    --bg-card:    #111c2a;
    --bg-header:  #0a1018;
    --border:     #1a2d42;
    --text:       #c9d1d9;
    --dim:        #526070;
    --bright:     #e8f0f8;
    --green:      #3fb950;
    --amber:      #d29922;
    --red:        #f85149;
    --tip:        #a371f7;
    --rss:        #f4a261;
    --mono: 'JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace;
    --ui:   system-ui,-apple-system,sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:transparent;
    font-family:var(--mono);
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    min-height:0;
    padding:0;
    margin:0;
  }

  .widget{
    width:100%;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--bg-panel);
    box-shadow:0 8px 32px rgba(0,0,0,.6),0 0 0 1px rgba(23,147,209,.08);
    overflow:hidden;
  }

  /* ── HEADER ── */
  .header{
    display:flex;align-items:center;gap:14px;
    padding:16px 18px;background:var(--bg-header);
    border-bottom:1px solid var(--border);
    cursor:pointer;user-select:none;
  }
  .header:hover{background:#0d1822;}

  /* Custom logo SVG — inspired by Arch triangle motif */
  .logo-svg{
    width:52px;height:52px;flex-shrink:0;
    filter:drop-shadow(0 0 8px rgba(23,147,209,.45));
  }

  .header-info{flex:1;overflow:hidden;}
  .header-domain{
    font-size:14px;font-weight:700;
    color:var(--bright);white-space:nowrap;
  }
  .header-domain span{color:var(--blue);}
  .header-sub{
    font-size:10px;color:var(--dim);
    letter-spacing:.08em;margin-top:3px;
  }

  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0;}
  .dot-row{display:flex;align-items:center;gap:6px;}
  .dot-label{font-size:11px;color:var(--dim);}
  .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--amber);box-shadow:0 0 8px var(--amber);
    animation:pulse 2s ease-in-out infinite;
  }
  .dot.ok   {background:var(--green);box-shadow:0 0 8px var(--green);}
  .dot.error{background:var(--red);box-shadow:0 0 8px var(--red);animation:none;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .bottom-row{display:flex;align-items:center;gap:8px;}
  .chevron{font-size:11px;color:var(--dim);transition:transform .25s;}
  .widget.open .chevron{transform:rotate(180deg);}

  /* LANG TOGGLE */
  .lang-toggle{
    display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;
  }
  .lang-btn{
    padding:3px 9px;background:transparent;border:none;
    font-family:var(--mono);font-size:10px;color:var(--dim);cursor:pointer;
    transition:background .15s,color .15s;letter-spacing:.04em;
  }
  .lang-btn.active{background:var(--blue-faint);color:var(--blue);}
  .lang-btn:hover:not(.active){color:var(--text);}

  /* RSS PREVIEW */
  .rss-preview{border-bottom:1px solid var(--border);}
  .rss-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 18px;text-decoration:none;
    border-bottom:1px solid rgba(26,45,66,.6);
    transition:background .15s;
  }
  .rss-item:last-child{border-bottom:none;}
  .rss-item:hover{background:#0f1d2e;}
  .rss-icon{flex-shrink:0;width:14px;height:14px;}
  .rss-title{
    font-size:11px;color:var(--text);
    flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  }
  .rss-item:hover .rss-title{color:var(--blue);}
  .rss-date{font-size:10px;color:var(--dim);flex-shrink:0;}

  /* TICKER */
  .ticker-wrap{
    overflow:hidden;position:relative;
    border-bottom:1px solid var(--border);
    background:rgba(23,147,209,.025);
  }
  .ticker-wrap::before,.ticker-wrap::after{
    content:'';position:absolute;top:0;bottom:0;width:32px;z-index:2;pointer-events:none;
  }
  .ticker-wrap::before{left:0;background:linear-gradient(to right,var(--bg-panel),transparent);}
  .ticker-wrap::after {right:0;background:linear-gradient(to left,var(--bg-panel),transparent);}
  .ticker-track{
    display:flex;align-items:center;white-space:nowrap;
    animation:scroll 80s linear infinite;
  }
  .ticker-track:hover{animation-play-state:paused;}
  @keyframes scroll{0%{transform:translateX(0);}100%{transform:translateX(var(--ticker-distance));}}
  .t-item{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 18px 8px 12px;
    font-size:11px;color:var(--text);
    text-decoration:none;flex-shrink:0;transition:color .15s;
  }
  .t-item:hover{color:var(--blue);}
  .t-item.is-tip{color:var(--tip);cursor:default;}
  .t-item.is-tip:hover{color:var(--tip);}
  .t-arch-sm{width:10px;height:10px;opacity:.7;flex-shrink:0;}
  .t-tip-tag{
    font-size:9px;color:var(--tip);
    border:1px solid rgba(163,113,247,.3);border-radius:2px;
    padding:0 3px;letter-spacing:.04em;flex-shrink:0;
  }
  .t-date{color:var(--dim);font-size:10px;}
  .t-sep{color:var(--blue);opacity:.2;font-size:9px;margin:0 2px;}
  .t-sep-tip{color:var(--tip);opacity:.2;font-size:9px;margin:0 2px;}

  /* PANEL */
  .panel{
    max-height:0;
    overflow:hidden;
    transition:max-height .35s cubic-bezier(.4,0,.2,1);
  }
  .widget.open .panel{
    max-height:700px;
    overflow-y:auto;
  }
  .panel::-webkit-scrollbar{width:3px;}
  .panel::-webkit-scrollbar-track{background:transparent;}
  .panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

  /* WIKI SEARCH */
  .search-bar{
    display:flex;align-items:center;gap:0;
    padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg-card);
  }
  .search-label{font-size:11px;color:var(--blue);padding-right:10px;flex-shrink:0;opacity:.9;}
  .search-input{
    flex:1;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;
    color:var(--bright);font-family:var(--mono);font-size:12px;padding:6px 12px;outline:none;
    transition:border-color .15s;
  }
  .search-input::placeholder{color:var(--dim);}
  .search-input:focus{border-color:var(--blue-dim);}
  .search-btn{
    margin-left:8px;background:transparent;border:1px solid var(--border);
    color:var(--dim);font-family:var(--mono);font-size:11px;
    padding:6px 14px;border-radius:6px;cursor:pointer;transition:all .15s;flex-shrink:0;
  }
  .search-btn:hover{border-color:var(--blue);color:var(--blue);}

  /* WIKI RESULT */
  .wiki-result{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg-panel);}
  .wiki-result.hidden{display:none;}
  .wiki-title{font-size:12px;color:var(--blue);margin-bottom:6px;font-weight:700;}
  .wiki-snippet{font-size:11px;color:var(--text);line-height:1.7;margin-bottom:8px;}
  .wiki-footer{display:flex;justify-content:space-between;align-items:center;}
  .wiki-page{font-size:11px;color:var(--blue);text-decoration:none;opacity:.75;}
  .wiki-page:hover{opacity:1;}
  .wiki-full{font-size:11px;color:var(--dim);text-decoration:none;}
  .wiki-full:hover{color:var(--blue);}
  .wiki-msg{font-size:11px;color:var(--dim);}

  /* NEWS CARDS */
  .panel-inner{padding:10px 12px;display:flex;flex-direction:column;gap:5px;}
  .panel-hdr{
    font-size:10px;color:var(--dim);letter-spacing:.08em;
    padding:0 4px 8px;border-bottom:1px solid var(--border);margin-bottom:2px;
  }
  .card{
    display:flex;align-items:center;gap:12px;
    padding:10px 14px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg-card);text-decoration:none;
    transition:border-color .15s,background .15s;
  }
  .card:hover{border-color:var(--blue-dim);background:#152030;}

  /* Card logo — inline SVG triangle */
  .card-logo-svg{width:16px;height:16px;flex-shrink:0;}

  .card-title{
    font-size:12px;color:var(--bright);
    flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  }
  .card:hover .card-title{color:var(--blue);}
  .card-date{font-size:10px;color:var(--dim);flex-shrink:0;}

  /* FOOTER */
  .footer{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 18px;border-top:1px solid var(--border);background:var(--bg-header);
  }
  .footer-txt{font-size:10px;color:var(--dim);}
  .footer-lnk{
    font-size:10px;color:var(--blue);text-decoration:none;opacity:.8;
    display:flex;align-items:center;gap:4px;
  }
  .footer-lnk:hover{opacity:1;}
  .state{font-size:11px;color:var(--dim);padding:16px;text-align:center;}
</style>
</head>
<body>
<div class="widget" id="widget">

  <!-- HEADER -->
  <div class="header" id="header">
    <!-- Custom arch-inspired triangle logo (not official trademark) -->
    <svg class="logo-svg" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lg1" x1="26" y1="4" x2="26" y2="48" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#4ab8f0"/>
          <stop offset="100%" stop-color="#1565a0"/>
        </linearGradient>
        <linearGradient id="lg2" x1="10" y1="20" x2="26" y2="48" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#1793d1" stop-opacity=".7"/>
          <stop offset="100%" stop-color="#0d4f80"/>
        </linearGradient>
      </defs>
      <!-- Main triangle -->
      <path d="M26 4L4 46h44L26 4z" fill="url(#lg1)" opacity=".9"/>
      <!-- Inner arch cutout -->
      <path d="M26 22 C22 28 18 36 16 44 H36 C34 36 30 28 26 22z" fill="var(--bg-header)"/>
      <!-- Left face shading -->
      <path d="M26 4L4 46h12L26 22z" fill="url(#lg2)"/>
      <!-- Highlight streak -->
      <path d="M26 6L22 18l4-4z" fill="white" opacity=".25"/>
    </svg>

    <div class="header-info">
      <div class="header-domain">archlinux.org/<span>news</span> <span id="itemCount" style="color:var(--dim);font-weight:400;font-size:12px;">—</span></div>
      <div class="header-sub">ARCH</div>
    </div>

    <div class="header-right">
      <div class="dot-row">
        <span class="dot-label">.dot</span>
        <div class="dot" id="dot"></div>
      </div>
      <div class="bottom-row">
        <div class="lang-toggle" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" onmouseup="event.stopPropagation()">
          <button class="lang-btn" id="btnEN" onclick="setLang('en')">EN</button>
          <button class="lang-btn" id="btnJA" onclick="setLang('ja')">JA</button>
        </div>
        <span class="chevron">▲</span>
      </div>
    </div>
  </div>

  <!-- RSS PREVIEW -->
  <div class="rss-preview" id="rssPreview"></div>

  <!-- TICKER -->
  <div class="ticker-wrap">
    <div class="ticker-track" id="tickerTrack">
      <span class="t-item" style="color:var(--dim)">connecting…</span>
    </div>
  </div>

  <!-- PANEL -->
  <div class="panel" id="panel">
    <div class="search-bar">
      <span class="search-label">wiki$</span>
      <input class="search-input" id="searchInput" type="text" autocomplete="off" placeholder="search Arch Wiki...">
      <button class="search-btn" id="searchBtn">search</button>
    </div>
    <div class="wiki-result hidden" id="wikiResult"></div>
    <div class="panel-inner" id="panelInner"><div class="state">loading…</div></div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span class="footer-txt" id="lastUpdated">—</span>
    <a href="https://archlinux.org/news/" class="footer-lnk">
      archlinux.org/news
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 9L9 2M9 2H4M9 2V7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>

</div>
<script>
const ARCH_LOGO = '';

const RSS_ICON = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <circle cx="6.18" cy="17.82" r="2.18" fill="#f4a261"/>
  <path d="M4 4.44v2.83c7.03 0 12.73 5.7 12.73 12.73h2.83c0-8.59-6.97-15.56-15.56-15.56zm0 5.66v2.83c3.9 0 7.07 3.17 7.07 7.07h2.83c0-5.47-4.43-9.9-9.9-9.9z" fill="#f4a261"/>
</svg>`;

const ARCH_SM = `<svg class="t-arch-sm" viewBox="0 0 20 20" fill="none">
  <path d="M10 2L2 18h16L10 2zm0 5l3 7H7l3-7z" fill="#1793d1" opacity=".8"/>
</svg>`;

const CARD_LOGO = `<svg class="card-logo-svg" viewBox="0 0 20 20" fill="none">
  <path d="M10 2L2 18h16L10 2zm0 5l3 7H7l3-7z" fill="#1793d1"/>
</svg>`;

const I18N = {
  en: {
    searching:'searching…', noResults:'no results.',
    fetchFailed:'RSS unavailable — Wiki search still works',
    tickerFail:'⚠ RSS unavailable — Wiki search still works ↓',
    updated:'updated',
    newsHeader: n => `// ${n} NEWS — click to open article`,
    searchPlaceholder:'search Arch Wiki...', searchBtn:'search',
    wikiLink:'full article', dotErr:'.err', dotOk:'.dot',
    tips:[
      'Always read the PKGBUILD before installing from AUR',
      'Check the news before running a system upgrade',
      'Use wiki$ to search the Arch Wiki instantly',
      'Never blindly trust AUR helpers — review changes first',
      'Partial upgrades are unsupported — always full-upgrade',
      'Arch Wiki is the most comprehensive Linux reference',
      'Before reporting a bug, check if it is a known issue here',
      'yay -Syu only after reading the latest news',
    ],
    tipTag:'TIP',
  },
  ja: {
    searching:'検索中…', noResults:'結果が見つかりません。',
    fetchFailed:'RSS取得失敗 — Wiki検索は利用可能',
    tickerFail:'⚠ RSS取得失敗 — Wiki検索は利用可能 ↓',
    updated:'更新',
    newsHeader: n => `// ${n} 件のニュース`,
    searchPlaceholder:'Arch Wiki を検索…', searchBtn:'検索',
    wikiLink:'全文を読む', dotErr:'.err', dotOk:'.dot',
    tips:[
      'AURからインストールする前に必ずPKGBUILDを確認しましょう',
      'アップグレード前にニュースをチェックする習慣を',
      'wiki$ でArch Wikiをすぐ検索できます',
      'AURヘルパーを盲目的に信頼しないこと',
      '部分アップグレードは非サポート — 常にフルアップグレードを',
      'Arch Wikiは最も充実したLinuxリファレンスです',
      'バグ報告の前に既知の問題か確認を',
      'yay -Syu は最新ニュースを読んでから',
    ],
    tipTag:'TIP',
  },
};

let lang = localStorage.getItem('arch-widget-lang') || 'en';
let newsData = [];

function t(key, ...args) {
  const v = I18N[lang][key];
  return typeof v === 'function' ? v(...args) : v;
}

function setLang(l) {
  lang = l;
  localStorage.setItem('arch-widget-lang', l);
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  document.getElementById('btnJA').classList.toggle('active', l==='ja');
  document.getElementById('searchInput').placeholder = t('searchPlaceholder');
  document.getElementById('searchBtn').textContent   = t('searchBtn');
  if (newsData.length) {
    renderPreview(newsData);
    renderTicker(newsData);
    renderCards(newsData);
  }
}

const WIKI = 'https://wiki.archlinux.org/api.php';

function loadNews() {
  if (typeof ARCH_NEWS_DATA !== 'undefined') return Promise.resolve(ARCH_NEWS_DATA);
  return Promise.resolve(null);
}

function buildSequence(news) {
  const tips = I18N[lang].tips;
  const seq = [];
  news.forEach((item, i) => {
    seq.push({type:'news', ...item});
    if ((i+1) % 3 === 0) {
      seq.push({type:'tip', text: tips[Math.floor(i/3) % tips.length]});
    }
  });
  return seq;
}

function renderPreview(data) {
  const wrap = document.getElementById('rssPreview');
  wrap.innerHTML = '';
  data.slice(0,2).forEach(d => {
    const a = document.createElement('a');
    a.className = 'rss-item';
    a.href = d.link;
    a.rel = 'noopener';
    a.innerHTML = `<span class="rss-icon">${RSS_ICON}</span><span class="rss-title">${esc(d.title)}</span><span class="rss-date">${d.date||'—'}</span>`;
    wrap.appendChild(a);
  });
}

function renderTicker(data) {
  const track = document.getElementById('tickerTrack');
  const seq = buildSequence(data);

  const makeItems = () => seq.map(item => {
    if (item.type === 'tip') {
      const s = document.createElement('span');
      s.className = 't-item is-tip';
      s.innerHTML = `<span class="t-tip-tag">${t('tipTag')}</span>${esc(item.text)}<span class="t-sep-tip">◆</span>`;
      return s;
    }

    const a = document.createElement('a');
    a.className = 't-item';
    a.href = item.link;
    a.rel = 'noopener';
    a.innerHTML = `${ARCH_SM}<span class="t-date">${item.date||'——'}</span>${esc(item.title)}<span class="t-sep">◆</span>`;
    return a;
  });

  track.innerHTML = '';
  [...makeItems(),...makeItems()].forEach(el => track.appendChild(el));

  const chars = seq.reduce((s,i) => s+(i.title||i.text||'').length, 0);
  const distance = track.children[seq.length].offsetLeft - track.children[0].offsetLeft; const speed = 50; track.style.setProperty('--ticker-distance', -distance + 'px'); track.style.animationDuration = (distance / speed) + 's';
}

function renderCards(data) {
  const inner = document.getElementById('panelInner');
  inner.innerHTML = `<div class="panel-hdr">${t('newsHeader', data.length)}</div>`;

  data.forEach(d => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = d.link;
    a.rel = 'noopener';
    a.innerHTML = `${CARD_LOGO}<div class="card-title">${esc(d.title)}</div><span class="card-date">${d.date||'—'}</span>`;
    inner.appendChild(a);
  });
}

async function searchWiki(query) {
  const box = document.getElementById('wikiResult');
  box.className = 'wiki-result';
  box.innerHTML = `<div class="wiki-msg">${t('searching')}</div>`;

  try {
    const sr = await fetch(
      `${WIKI}?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=1&format=json&origin=*`,
      {signal:AbortSignal.timeout(7000)}
    );

    const sd = await sr.json();
    const hit = sd?.query?.search?.[0];

    if (!hit) {
      box.innerHTML = `<div class="wiki-msg">${t('noResults')}</div>`;
      return;
    }

    const er = await fetch(
      `${WIKI}?action=query&prop=extracts&exintro=true&exsentences=4&explaintext=true&titles=${encodeURIComponent(hit.title)}&format=json&origin=*`,
      {signal:AbortSignal.timeout(7000)}
    );

    const ed = await er.json();
    const page = Object.values(ed?.query?.pages||{})[0];
    const extract = page?.extract?.trim() || hit.snippet?.replace(/<[^>]+>/g,'') || '';
    const url = `https://wiki.archlinux.org/title/${encodeURIComponent(hit.title.replace(/ /g,'_'))}`;

    box.innerHTML = `
      <div class="wiki-title">§ ${esc(hit.title)}</div>
      <div class="wiki-snippet">${esc(extract.slice(0,380))}${extract.length>380?'…':''}</div>
      <div class="wiki-footer">
        <a class="wiki-page" href="${url}" rel="noopener">${esc(hit.title)}</a>
        <a class="wiki-full" href="${url}" rel="noopener">${t('wikiLink')} ↗</a>
      </div>`;
  } catch(e) {
    box.innerHTML = `<div class="wiki-msg">error: ${esc(String(e))}</div>`;
  }
}

let headerDragStartX = 0;
let headerDragStartY = 0;

document.getElementById('header').addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  headerDragStartX = e.screenX;
  headerDragStartY = e.screenY;
  document.title = 'dragstart';
});

document.getElementById('header').addEventListener('mouseup', (e) => {
  if (e.button !== 0) return;

  const dx = Math.abs(e.screenX - headerDragStartX);
  const dy = Math.abs(e.screenY - headerDragStartY);

  document.title = 'dragend';

  if (dx < 5 && dy < 5) {
    const w = document.getElementById('widget');
    w.classList.toggle('open');
    setTimeout(syncWindowSize, 400);
  }
});

document.getElementById('searchBtn').addEventListener('click', () => {
  const q=document.getElementById('searchInput').value.trim();
  if(q) searchWiki(q);
});

document.getElementById('searchInput').addEventListener('keydown', e => {
  if(e.key==='Enter'){
    const q=e.target.value.trim();
    if(q) searchWiki(q);
  }
});

function syncWindowSize() {
  const widget = document.getElementById('widget');
  if (!widget) return;

  const rect = widget.getBoundingClientRect();
  const width = Math.ceil(rect.width);
  const height = Math.ceil(rect.height);

  document.title = `resize:${width}x${height}`;
}

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

(async () => {
  setLang(lang);

  const data = await loadNews();
  const dot = document.getElementById('dot');

  if (!data || !data.items || !data.items.length) {
    dot.className = 'dot error';
    document.getElementById('itemCount').textContent = '— news.json not found';
    document.getElementById('itemCount').style.color = 'var(--red)';
    document.getElementById('tickerTrack').innerHTML =
      `<span class="t-item" style="color:var(--red)">${t('tickerFail')}</span>`;
    document.getElementById('panelInner').innerHTML =
      `<div class="state">${t('fetchFailed')}</div>`;
    return;
  }

  newsData = data.items;

  dot.className = 'dot ok';
  document.getElementById('itemCount').textContent = `— ${newsData.length} items`;
  document.getElementById('lastUpdated').textContent =
    t('updated')+' '+(data.updated || new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));

  renderPreview(newsData);
  renderTicker(newsData);
  renderCards(newsData);

  setTimeout(syncWindowSize, 100);
})();

// Intercept all link clicks and pass to Python via document.title
document.addEventListener('click', function(e) {
  const a = e.target.closest('a');

  if (a && a.href && a.href.startsWith('http')) {
    e.preventDefault();
    document.title = 'open:' + a.href;
    setTimeout(syncWindowSize, 500);
  }
}, true);
</script>
</body>
</html>
